name: Update Version Catalog

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version (optional)'
        required: false
        type: string
      commit_directly:
        description: 'Commit directly'
        required: false
        type: boolean
        default: false

jobs:
  update-version-catalog:
    runs-on: ubuntu-latest
    environment: Automations
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.AUTOMATIONS_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      - name: Get Minecraft Version
        id: minecraft-version
        run: |
          if [ -n "${{ inputs.minecraft_version }}" ]; then
            echo "version=${{ inputs.minecraft_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          # Strip leading "1." for NeoForge/Balm version patterns
          STRIPPED_VERSION=$(echo "${{ inputs.minecraft_version || github.ref_name }}" | sed 's/^1\.//')
          echo "stripped_version=$STRIPPED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Get Fabric API Version
        id: fabric-api
        uses: TwelveIterations/get-fabric-api-version@v1
        continue-on-error: true
        with:
          minecraftVersion: "${{ steps.minecraft-version.outputs.version }}"
      - name: Get Fabric Loader Version
        id: fabric-loader
        uses: TwelveIterations/get-fabric-loader-version@v1
        continue-on-error: true
      - name: Get NeoForm Version
        id: neoform
        uses: TwelveIterations/get-neoform-version@v1
        continue-on-error: true
        with:
          version: "${{ steps.minecraft-version.outputs.version }}-*"
      - name: Get NeoForge Version
        id: neoforge
        uses: TwelveIterations/get-neoforge-version@v1
        continue-on-error: true
        with:
          version: "${{ steps.minecraft-version.outputs.stripped_version }}.*"
      - name: Get Forge Version
        id: forge
        uses: TwelveIterations/get-forge-version@v1
        continue-on-error: true
        with:
          minecraftVersion: "${{ steps.minecraft-version.outputs.version }}"
          channel: "latest"
      - name: Get Balm Version
        id: balm
        uses: TwelveIterations/get-nexus-version@v1
        continue-on-error: true
        with:
          nexusUrl: 'https://maven.twelveiterations.com'
          repository: 'maven-releases'
          groupId: 'net.blay09.mods'
          artifactId: 'balm-common'
          version: '${{ steps.minecraft-version.outputs.stripped_version }}.*'
      - name: Update version catalog
        run: |
          # Update Minecraft Version
          sed -i 's|^\s*minecraft\s*=\s*".*"|minecraft = "${{ steps.minecraft-version.outputs.version }}"|' gradle/libs.versions.toml
          
          # Update Fabric API
          if [ -n "${{ steps.fabric-api.outputs.version }}" ]; then
            sed -i 's|^\s*fabricApi\s*=\s*".*"|fabricApi = "${{ steps.fabric-api.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Update Fabric Loader
          if [ -n "${{ steps.fabric-loader.outputs.version }}" ]; then
            sed -i 's|^\s*fabricLoader\s*=\s*".*"|fabricLoader = "${{ steps.fabric-loader.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Update NeoForm
          if [ -n "${{ steps.neoform.outputs.version }}" ]; then
            sed -i 's|^\s*neoForm\s*=\s*".*"|neoForm = "${{ steps.neoform.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Update NeoForge
          if [ -n "${{ steps.neoforge.outputs.version }}" ]; then
            sed -i 's|^\s*neoForge\s*=\s*".*"|neoForge = "${{ steps.neoforge.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Update Forge
          if [ -n "${{ steps.forge.outputs.version }}" ]; then
            sed -i 's|^\s*forge\s*=\s*".*"|forge = "${{ steps.forge.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Update Balm
          if [ -n "${{ steps.balm.outputs.version }}" ]; then
            sed -i 's|^\s*balm\s*=\s*".*"|balm = "${{ steps.balm.outputs.version }}"|' gradle/libs.versions.toml
          fi
          
          # Check if there are changes
          if git diff --quiet gradle/libs.versions.toml; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
        id: update-catalog
      - name: Check and create branch if needed
        id: branch-check
        run: |
          TARGET_BRANCH="${{ steps.minecraft-version.outputs.version }}"
          CURRENT_BRANCH="${{ github.ref_name }}"
          
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "current_branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          
          # Check if target branch exists remotely
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            
            # Create the branch if it doesn't exist
            if [ "$TARGET_BRANCH" != "$CURRENT_BRANCH" ]; then
              git checkout -b "$TARGET_BRANCH"
              git push origin "$TARGET_BRANCH"
              git checkout "$CURRENT_BRANCH"
            fi
          fi
      - name: Create Pull Request
        if: steps.update-catalog.outputs.updated == 'true' && inputs.commit_directly == false && steps.branch-check.outputs.branch_exists == 'true'
        run: |
          # Create and checkout branch
          git checkout -b automations/version-catalog-${{ github.run_number }}
          
          # Add and commit changes
          git add gradle/libs.versions.toml
          git commit -m "Update version catalog"
          
          # Push branch to remote
          git push origin automations/version-catalog-${{ github.run_number }}
          
          # Create pull request using GitHub CLI
          gh pr create \
            --title "Update version catalog" \
            --body "## Version Catalog Updates
            
          This PR updates the version catalog to use the following versions:
          - **Fabric API**: ${{ steps.fabric-api.outputs.version }}
          - **Fabric Loader**: ${{ steps.fabric-loader.outputs.version }}
          - **NeoForm**: ${{ steps.neoform.outputs.version }}
          - **NeoForge**: ${{ steps.neoforge.outputs.version }}
          - **Forge**: ${{ steps.forge.outputs.version }}
          - **Balm**: ${{ steps.balm.outputs.version }}
          
          This PR was automatically created by the Update Version Catalog workflow." \
            --base ${{ steps.branch-check.outputs.target_branch }} \
            --head automations/version-catalog-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Commit and push directly
        if: steps.update-catalog.outputs.updated == 'true' && (inputs.commit_directly == true || steps.branch-check.outputs.branch_exists == 'false')
        run: |
          TARGET_BRANCH="${{ steps.branch-check.outputs.target_branch }}"
          
          # Switch to target branch if different from current
          if [ "$TARGET_BRANCH" != "${{ steps.branch-check.outputs.current_branch }}" ]; then
            git checkout "$TARGET_BRANCH"
          fi
          
          git add gradle/libs.versions.toml
          git commit -m "Update version catalog"
          git push origin "$TARGET_BRANCH"
      - name: No update needed
        if: steps.update-catalog.outputs.updated == 'false'
        run: |
          echo "Version catalog is already up to date"
